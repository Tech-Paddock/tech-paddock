name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [home, editor, resume]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Dummy values — this job only checks that the app compiles, it
          # never talks to real services. Real secrets live in Vercel.
          ANTHROPIC_API_KEY: dummy
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy
          APP_PASSWORD_HASH: dummy
