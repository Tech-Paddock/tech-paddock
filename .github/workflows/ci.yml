name: CI

on:
  # Every branch, not just main. Agents commit and push; a pull request only
  # exists once Joel asks for one, so if CI ran only on pull requests then work
  # would sit unbuilt and untested until the moment he was asked to approve it.
  push:
    branches: ['**']
  # Opening a pull request re-runs it once, so the checks are attached to the
  # pull request itself rather than only to the commit. Pushes after that are
  # covered above.
  pull_request:
    types: [opened, reopened]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [home, editor, resume, tracker, coffee]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build
        env:
          # Dummy values — this job only checks that the app compiles, it
          # never talks to real services. Real secrets live in Vercel.
          ANTHROPIC_API_KEY: dummy
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy
          APP_PASSWORD_HASH: dummy
          EDITOR_BASE_URL: https://editor.techpaddock.io
          INTERNAL_API_SECRET: dummy
