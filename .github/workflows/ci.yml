name: CI

on:
  # Every branch, not just main. Agents commit and push; a pull request only
  # exists once Joel asks for one, so if CI ran only on pull requests then work
  # would sit unbuilt and untested until the moment he was asked to approve it.
  push:
    branches: ['**']
  # Opening a pull request re-runs it once, so the checks are attached to the
  # pull request itself rather than only to the commit. Pushes after that are
  # covered above.
  pull_request:
    types: [opened, reopened]

# Nothing here writes to the repository, comments, or reads a secret, so the
# token can read and do nothing else — whatever the organisation's default is.
permissions:
  contents: read

# One run per ref at a time. A newer push to a branch makes the run for the
# older commit pointless, so that one is cancelled. Not on main: every merge
# there is its own production deploy, and its run is the record of it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The roster is whatever is on disk under apps/, read once, here.
  #
  # It used to be a hardcoded list of five names, and CLAUDE.md documented the
  # cost honestly: a sixth app was never tested, and it did not fail — it simply
  # never ran. That is fine for a roster that never changes and wrong for one
  # that does. Apps get added and deprecated here, so the list derives from the
  # thing that physically exists instead of from a copy of it.
  roster:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Which apps exist?
        id: list
        run: |
          set -euo pipefail
          apps="$(ls -d apps/*/ 2>/dev/null | xargs -n1 basename | sort | jq -R . | jq -sc .)"

          # An empty matrix builds nothing and reports success, which is the
          # silent-skip failure this job exists to remove. Fail loudly instead.
          if [ -z "$apps" ] || [ "$apps" = "[]" ]; then
            echo "::error::No app folders found under apps/. Refusing to report a green build for nothing."
            exit 1
          fi

          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Roster: $apps"

  build:
    needs: roster
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.roster.outputs.apps) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      # Full history: the scope check below needs a merge base with main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The scope step runs a repo script, so it runs on the Node the apps
      # declare rather than whatever the runner image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Every job in the matrix still RUNS and still REPORTS, even when it has
      # nothing to build. That is deliberate and it is the whole trick.
      # Branch protection requires these checks by name, and a job skipped by a
      # workflow-level `paths:` filter never reports at all — so the required
      # check is never satisfied and the pull request can never merge. Slow
      # builds would have been traded for stuck merges. Exiting early inside the
      # job keeps the green tick and skips the minute of work.
      #
      # Values from the event and the matrix reach the shell through `env:`,
      # never through `${{ }}` inside the script, so a folder name is data and
      # never code.
      - name: Does this app need building?
        id: scope
        working-directory: .
        env:
          APP: ${{ matrix.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          decide() { echo "$1"; echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "build=$2" >> "$GITHUB_OUTPUT"; }

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # main is scoped by HEAD^..HEAD — the range each app's Vercel
            # ignoreCommand diffs — so CI builds on main exactly what Vercel is
            # about to deploy.
            #
            # It used to build every app on every merge, on the reasoning that a
            # merge can break an app it did not touch. Here it cannot. Merges are
            # squashed and branch protection requires a branch to be up to date,
            # so the tree main lands on is the tree the branch already built; an
            # app the merge did not touch is byte-identical to the last build of
            # it; apps share no code except through packages/, which is in every
            # scope; and .github/workflows and supabase still rebuild everything.
            # Most merges here are documentation, and each one cost a cold
            # build of every app that could not stop a deploy the same push
            # had already started. What this gives up: a change outside the repo — the runner
            # image, a registry — surfaces when an app next changes, which is
            # also when Vercel would next build it.
            #
            # Fail open wherever HEAD^ is not the whole change: no parent, or a
            # push that carried more than one commit.
            if ! base="$(git rev-parse --verify --quiet 'HEAD^')"; then
              decide "main has no parent commit — building to be safe" yes; exit 0
            fi
            if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$base" ]; then
              decide "this push to main carried more than one commit, so HEAD^ is not the whole change — building to be safe" yes; exit 0
            fi
          else
            git fetch origin main --quiet || true
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
            if [ -z "$base" ]; then
              decide "no merge base with main — building to be safe" yes; exit 0
            fi
          fi

          # This app's scope is whatever its Vercel ignoreCommand watches, read by
          # the same script drift uses, so CI and Vercel cannot disagree about it.
          # A hardcoded list here missed packages/ for weeks (TEC-10). Plus the
          # shared things that can break any app: the workflow itself, and the
          # migration history every app reads.
          #
          # Fail OPEN: a scope nobody can read builds, and so does an empty one.
          # A skipped build is the silent failure; an extra one costs a minute.
          if ! scope="$(node scripts/build-scope.mjs "$APP")"; then
            decide "could not read apps/$APP/vercel.json's scope — building to be safe" yes; exit 0
          fi
          if [ -z "$scope" ]; then
            decide "build-scope printed nothing for apps/$APP — building to be safe" yes; exit 0
          fi
          if [ "$scope" = "ALWAYS" ]; then
            decide "apps/$APP diffs nothing in its ignoreCommand, so it always builds" yes; exit 0
          fi
          read -r -a paths <<< "$scope"

          if git diff --quiet "$base" HEAD -- "${paths[@]}" ".github/workflows" "supabase"; then
            decide "nothing under ${scope}, .github/workflows or supabase changed since ${base:0:7}" no
          else
            decide "changed since ${base:0:7}" yes
          fi

      - name: Nothing to do
        if: steps.scope.outputs.build != 'yes'
        working-directory: .
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        run: echo "Skipped — ${REASON}. Reporting success so the required check is satisfied."

      - name: Cache npm for this app
        uses: actions/setup-node@v4
        if: steps.scope.outputs.build == 'yes'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci
        if: steps.scope.outputs.build == 'yes'

      - name: Test
        if: steps.scope.outputs.build == 'yes'
        run: npm run test --if-present

      - name: Build
        if: steps.scope.outputs.build == 'yes'
        run: npm run build
        env:
          # Dummy values — this job only checks that the app compiles, it
          # never talks to real services. Real secrets live in Vercel.
          ANTHROPIC_API_KEY: dummy
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy
          APP_PASSWORD_HASH: dummy
          EDITOR_BASE_URL: https://editor.techpaddock.io
          INTERNAL_API_SECRET: dummy

      # `next build` type-checks only what the build compiles. Tests, the vitest
      # config and anything else tsconfig includes are checked here, after the
      # build because the build is what writes next-env.d.ts. --no-install: a
      # missing typescript fails here instead of npx fetching a stranger's `tsc`.
      - name: Typecheck
        if: steps.scope.outputs.build == 'yes'
        run: npx --no-install tsc --noEmit

  # The mechanical half of the weekly rules-drift audit, run on every push.
  #
  # Every one of these files grew monotonically for five days: the ledger from
  # 76 lines to 588, of which 401 were an archive of finished work that every
  # agent read at the start of every session. "Overwrite it" was already the
  # written rule and it failed, because nothing bounded it. This is the bound —
  # and it now also measures the facts CLAUDE.md asserts, rather than trusting
  # the document that asserts them.
  #
  # The ceilings are deliberately generous. You cannot hit one writing a real
  # handoff, only by letting a file become a log again. A check that fires on
  # good work teaches agents to route around checks, which costs more than it
  # catches.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The handoff-staleness check compares each file's stated date against
          # the newest commit in that agent's area, so it needs real history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rules match the repo they describe
        run: node scripts/drift-check.mjs

  # THE required check, and the only one whose name has to stay stable.
  #
  # Branch protection requires checks BY NAME, so a per-app matrix meant the
  # required-check list changed shape every time an app was added or removed —
  # and no agent here can read a ruleset to confirm it. Deprecating an app was
  # worse than adding one: the matrix still named the deleted folder, its job
  # failed on a missing working directory, and the required check stuck red.
  #
  # One fixed name in front of everything fixes both. The per-app jobs still
  # report individually so a reader can see which app broke; they are just no
  # longer what the ruleset names.
  #
  # `if: always()` is load-bearing. Without it this job is SKIPPED when a
  # dependency fails, and a skipped job is not a failed one — the gate would
  # stop saying "red" at exactly the moment something is. drift fails the file
  # if it goes, or if the gate stops waiting on roster, build or drift.
  gate:
    needs: [roster, build, drift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Everything that has to pass, passed
        env:
          ROSTER: ${{ needs.roster.result }}
          BUILD: ${{ needs.build.result }}
          DRIFT: ${{ needs.drift.result }}
        run: |
          printf '  roster  %s\n  build   %s\n  drift   %s\n' "$ROSTER" "$BUILD" "$DRIFT"

          fail=0
          for pair in "roster:$ROSTER" "build:$BUILD" "drift:$DRIFT"; do
            name="${pair%%:*}"; result="${pair#*:}"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not pass — it reported '$result'."
              fail=1
            fi
          done
          exit "$fail"
