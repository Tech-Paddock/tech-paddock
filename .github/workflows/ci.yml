name: CI

on:
  # Every branch, not just main. Agents commit and push; a pull request only
  # exists once Joel asks for one, so if CI ran only on pull requests then work
  # would sit unbuilt and untested until the moment he was asked to approve it.
  push:
    branches: ['**']
  # Opening a pull request re-runs it once, so the checks are attached to the
  # pull request itself rather than only to the commit. Pushes after that are
  # covered above.
  pull_request:
    types: [opened, reopened]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [home, editor, resume, tracker, coffee]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      # Full history: the scope check below needs a merge base with main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every job in the matrix still RUNS and still REPORTS, even when it has
      # nothing to build. That is deliberate and it is the whole trick.
      # Branch protection requires these checks by name, and a job skipped by a
      # workflow-level `paths:` filter never reports at all — so the required
      # check is never satisfied and the pull request can never merge. Slow
      # builds would have been traded for stuck merges. Exiting early inside the
      # job keeps the green tick and skips the minute of work.
      - name: Does this app need building?
        id: scope
        working-directory: .
        run: |
          set -euo pipefail

          # main is what production deploys from, so it is always built in full.
          # A merge commit can touch one app while another was broken by the
          # merge itself, and that is exactly when you want every app checked.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "reason=on main — building everything" >> "$GITHUB_OUTPUT"
            echo "build=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main --quiet || true
          base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          if [ -z "$base" ]; then
            echo "reason=no merge base with main — building to be safe" >> "$GITHUB_OUTPUT"
            echo "build=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This app's own folder, plus the shared things that can break any app:
          # the workflow itself, and the migration history every app reads.
          if git diff --quiet "$base" HEAD -- \
               "apps/${{ matrix.app }}" \
               ".github/workflows" \
               "supabase"; then
            echo "reason=nothing under apps/${{ matrix.app }}, .github/workflows or supabase changed" >> "$GITHUB_OUTPUT"
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "reason=changed since ${base}" >> "$GITHUB_OUTPUT"
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do
        if: steps.scope.outputs.build != 'yes'
        working-directory: .
        run: echo "Skipped — ${{ steps.scope.outputs.reason }}. Reporting success so the required check is satisfied."

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.build == 'yes'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci
        if: steps.scope.outputs.build == 'yes'

      - name: Test
        if: steps.scope.outputs.build == 'yes'
        run: npm run test --if-present

      - name: Build
        if: steps.scope.outputs.build == 'yes'
        run: npm run build
        env:
          # Dummy values — this job only checks that the app compiles, it
          # never talks to real services. Real secrets live in Vercel.
          ANTHROPIC_API_KEY: dummy
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy
          APP_PASSWORD_HASH: dummy
          EDITOR_BASE_URL: https://editor.techpaddock.io
          INTERNAL_API_SECRET: dummy

  # Every one of these files grew monotonically for five days: the ledger from
  # 76 lines to 588, of which 401 were an archive of finished work that every
  # agent read at the start of every session. "Overwrite it" was already the
  # written rule and it failed, because nothing bounded it. This is the bound.
  #
  # The ceilings are deliberately generous — you cannot hit one writing a real
  # handoff, only by letting a file become a log again. A check that fires on
  # good work teaches agents to route around checks, which costs more than it
  # catches.
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Handoffs, ledger and decisions stay within budget
        run: |
          set -uo pipefail
          fail=0

          check() {
            path="$1"; ceiling="$2"
            [ -f "$path" ] || return 0
            n=$(wc -l < "$path")
            if [ "$n" -gt "$ceiling" ]; then
              echo "::error file=$path::$path is $n lines, over its $ceiling-line budget."
              echo "   A handoff is state, not history. Overwrite it — do not append."
              echo "   Anything that outlives this release belongs in .claude/DECISIONS.md;"
              echo "   anything finished belongs nowhere, because git log is the archive."
              fail=1
            else
              printf '  ok  %-44s %3d / %s\n' "$path" "$n" "$ceiling"
            fi
          }

          for f in .claude/agents/*/HANDOFF.md; do check "$f" 80; done
          check .claude/OPEN-ITEMS.md 80
          check .claude/DECISIONS.md 200

          # The ledger carries what is open. A "Done" heading is how it became
          # a 588-line file the last time.
          if [ -f .claude/OPEN-ITEMS.md ] && grep -qiE '^#+ *done' .claude/OPEN-ITEMS.md; then
            echo "::error file=.claude/OPEN-ITEMS.md::The ledger has a 'Done' section again."
            echo "   Finished work is not an open item. Delete it; git log is the archive."
            fail=1
          fi

          # Worklogs were retired on 2026-09-16 — see the communication layer in
          # CLAUDE.md. They existed so a live agent could see what another live
          # agent had claimed, and agents here never run at the same time.
          if [ -d .claude/worklogs ]; then
            echo "::error::.claude/worklogs/ is back. Worklogs were retired; see CLAUDE.md."
            fail=1
          fi

          exit "$fail"
