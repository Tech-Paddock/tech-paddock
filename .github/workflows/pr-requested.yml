name: Pull request

# Every pull request body records the request, because no later session can see
# the conversation. This check finds the line; it cannot verify the quote.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  request-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // Only rendered text counts: skip HTML comments and code fences.
            const visible = [];
            let fence = null;
            for (const line of body.replace(/<!--[\s\S]*?(?:-->|$)/g, '').split(/\r?\n/)) {
              const f = line.match(/^ {0,3}(`{3,}|~{3,})/);
              if (fence) {
                if (f && f[1][0] === fence[0] && f[1].length >= fence.length && !/\S/.test(line.slice(line.indexOf(f[1]) + f[1].length))) fence = null;
                continue;
              }
              if (f) { fence = f[1]; continue; }
              visible.push(line);
            }

            // One visible line: Requested on YYYY-MM-DD — "quote". Bullet, bold
            // and curly quotes are allowed. The date must be real and not in the
            // future; the quote must be filled in.
            const NOTE = /^\s*(?:[-*+]\s+)?(?:\*\*|__)?Requested on (\d{4})-(\d{2})-(\d{2})(?:\*\*|__)?\s*[—–-]\s*["“”]([^"“”]*)["“”]/;
            const problems = [];
            for (const line of visible) {
              const m = line.match(NOTE);
              if (!m) continue;
              const [, y, mo, d, quote] = m;
              const date = new Date(Date.UTC(+y, +mo - 1, +d));
              const real = date.getUTCFullYear() === +y && date.getUTCMonth() === +mo - 1 && date.getUTCDate() === +d;
              if (!real) { problems.push(`${y}-${mo}-${d} is not a calendar date.`); continue; }
              // One day of slack for time zones.
              if (date.getTime() > Date.now() + 86400000) { problems.push(`${y}-${mo}-${d} is in the future.`); continue; }
              if (!quote.trim() || /^the request, quoted$/i.test(quote.trim())) { problems.push('The quote is empty or still the template placeholder.'); continue; }
              core.info(`Request recorded in the pull request body: ${y}-${mo}-${d}.`);
              return;
            }

            core.setFailed(
              [
                problems.length
                  ? 'The request line does not hold up:\n  ' + problems.join('\n  ')
                  : 'The pull request body has no request line.',
                '',
                'Add one visible line (not in an HTML comment or code block):',
                '',
                '  Requested on YYYY-MM-DD — "the request, quoted"',
              ].join('\n'),
            );
