name: Pull request

# Agents commit and push. A pull request exists only because Joel asked for one,
# and no other agent can see the conversation where he did — so the request is
# recorded in the pull request body or it did not happen as far as the repo is
# concerned.
#
# This check reads that line. It cannot tell whether the quote is real, and it
# is no longer the gate: since #186 a PreToolUse hook holds every pull request an
# agent opens for Joel's click. What the hook leaves behind is nothing another
# agent can read, so this line is the record of who asked and what he said. It
# also catches a pull request opened somewhere the hook does not run. Kept on
# that reasoning by Joel, 2026-09-23. It catches the line somebody forgot, not
# one they invented.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  requested-by-joel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // Only what a reader of the pull request can see counts. An HTML
            // comment is invisible once rendered (an unclosed one hides the
            // rest of the body), and a line inside a code fence is an example
            // of the record, not the record — both used to pass.
            const visible = [];
            let fence = null;
            for (const line of body.replace(/<!--[\s\S]*?(?:-->|$)/g, '').split(/\r?\n/)) {
              const f = line.match(/^ {0,3}(`{3,}|~{3,})/);
              if (fence) {
                if (f && f[1][0] === fence[0] && f[1].length >= fence.length && !/\S/.test(line.slice(line.indexOf(f[1]) + f[1].length))) fence = null;
                continue;
              }
              if (f) { fence = f[1]; continue; }
              visible.push(line);
            }

            // One line, anywhere in what is visible:
            //   Requested by Joel on 2026-09-12 — "what he said"
            // It may be a bullet or bold, and the quotes may be curly. The date
            // has to exist and not be in the future; the quote has to be filled.
            const NOTE = /^\s*(?:[-*+]\s+)?(?:\*\*|__)?Requested by Joel on (\d{4})-(\d{2})-(\d{2})(?:\*\*|__)?\s*[—–-]\s*["“”]([^"“”]*)["“”]/;
            const problems = [];
            for (const line of visible) {
              const m = line.match(NOTE);
              if (!m) continue;
              const [, y, mo, d, quote] = m;
              const date = new Date(Date.UTC(+y, +mo - 1, +d));
              const real = date.getUTCFullYear() === +y && date.getUTCMonth() === +mo - 1 && date.getUTCDate() === +d;
              if (!real) { problems.push(`${y}-${mo}-${d} is not a calendar date.`); continue; }
              // A day of slack for time zones; a request cannot postdate its record by more.
              if (date.getTime() > Date.now() + 86400000) { problems.push(`${y}-${mo}-${d} is in the future.`); continue; }
              if (!quote.trim() || /^what he said$/i.test(quote.trim())) { problems.push('The quote is empty or still the template placeholder.'); continue; }
              core.info(`Request recorded in the pull request body: ${y}-${mo}-${d}.`);
              return;
            }

            core.setFailed(
              [
                problems.length
                  ? 'This pull request has a "Requested by Joel" line, but it does not hold up:\n  ' + problems.join('\n  ')
                  : 'This pull request does not record who asked for it.',
                '',
                'Agents here commit and push; a pull request is opened only when Joel asks',
                'for one. No other agent can see that conversation, so the request is',
                'recorded here or it did not happen as far as the repo is concerned.',
                '',
                'Add one line to the pull request body — visible, not inside an HTML comment',
                'or a code block — and this check passes:',
                '',
                '  Requested by Joel on YYYY-MM-DD — "what he said"',
                '',
                'If nobody asked for this pull request, close it and leave the branch pushed.',
              ].join('\n'),
            );
