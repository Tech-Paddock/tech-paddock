name: Promotion

# Every pull request here opens as a draft and is promoted only after Joel
# approves it in chat. The agent promotes its own, which means the approval has
# to leave a trace in the repo — no other agent can see that conversation, and a
# pull request that is merely out of draft is indistinguishable from one an
# agent promoted on its own initiative.
#
# This check reads that trace. A draft passes trivially; a promoted pull request
# with no approval note fails.
#
# What it cannot do: tell whether the quote is real. Every agent comments as the
# same GitHub account, so authorship proves nothing. This catches the approval
# somebody forgot to get, not one they invented.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  # A note posted after promotion would otherwise leave the check red until
  # something else re-ran it. Comment events let it heal itself.
  issue_comment:
    types: [created, edited]

permissions:
  pull-requests: read
  issues: read

jobs:
  approval-recorded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            let pr = context.payload.pull_request;
            if (context.eventName === 'issue_comment') {
              if (!context.payload.issue.pull_request) {
                core.info('A comment on a plain issue. Nothing to check.');
                return;
              }
              const got = await github.rest.pulls.get({
                ...context.repo,
                pull_number: context.payload.issue.number,
              });
              pr = got.data;
            }
            if (!pr) {
              core.info('No pull request in this event. Nothing to check.');
              return;
            }
            if (pr.draft) {
              core.info('Draft. Nothing to check until it is promoted.');
              return;
            }

            // One line, in any comment on the pull request:
            //   Approved by Joel on 2026-09-12 — "what he said"
            const NOTE = /^\s*Approved by Joel on \d{4}-\d{2}-\d{2}\s*[—–-]\s*".+"/m;

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const found = comments.find((c) => NOTE.test(c.body || ''));

            if (found) {
              core.info(`Approval recorded: ${found.html_url}`);
              return;
            }

            core.setFailed(
              [
                'This pull request is out of draft with no approval note on it.',
                '',
                'Every pull request here is promoted only after Joel approves it in chat.',
                'Because no other agent can see that conversation, the approval has to be',
                'recorded here or it did not happen as far as the repo is concerned.',
                '',
                'Post one line in a comment on this pull request, then this check passes:',
                '',
                '  Approved by Joel on YYYY-MM-DD — "what he said"',
                '',
                'If it was promoted without an approval, convert it back to draft instead.',
              ].join('\n'),
            );
