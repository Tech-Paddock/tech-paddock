  <circle cx="148" cy="256" r="42" fill="none" stroke="#F1F6F2" stroke-width="14"/>
  <circle cx="148" cy="360" r="42" fill="none" stroke="#F1F6F2" stroke-width="14"/>
  <g stroke="#F1F6F2" stroke-width="20" stroke-linecap="round">
    <line x1="228" y1="152" x2="420" y2="152"/>
    <line x1="228" y1="256" x2="420" y2="256"/>
    <line x1="228" y1="360" x2="380" y2="360"/>
