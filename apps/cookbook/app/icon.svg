<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cookbook">
  <!-- Race roundel. Chosen by Joel on 2026-09-22 from ten candidates.
       Colours are the Clark livery's own, copied from lib/theme.css:
       accent #0F5C33 is the Type 25's green, tone-4 #FFD84D its yellow
       nose stripe, and the roundel is tone-1 #DCECE1 rather than white so
       it sits in the palette. The C stands where a race number would. -->
  <rect width="64" height="64" rx="14" fill="#0F5C33"/>
  <rect x="28" y="0" width="8" height="64" fill="#FFD84D"/>
  <circle cx="32" cy="32" r="18" fill="#DCECE1"/>
  <path d="M39.5 24.5 A10.5 10.5 0 1 0 39.5 39.5" stroke="#0F5C33" stroke-width="5.5" stroke-linecap="round" fill="none"/>
</svg>
