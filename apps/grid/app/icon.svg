<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Grid">
  <!-- Grid: a three-by-three grid of rounded squares, the middle one filled,
       on the clark bar colour #0A1A11 (lib/theme.css). Plain shapes drawn by
       hand; no brand mark, no text. favicon.ico, apple-touch-icon.png and the
       manifest PNGs are rendered from this file. -->
  <rect width="512" height="512" rx="96" fill="#0A1A11"/>
  <g fill="none" stroke="#F1F6F2" stroke-width="14">
    <rect x="92" y="92" width="94" height="94" rx="18"/>
    <rect x="209" y="92" width="94" height="94" rx="18"/>
    <rect x="326" y="92" width="94" height="94" rx="18"/>
    <rect x="92" y="209" width="94" height="94" rx="18"/>
    <rect x="326" y="209" width="94" height="94" rx="18"/>
    <rect x="92" y="326" width="94" height="94" rx="18"/>
    <rect x="209" y="326" width="94" height="94" rx="18"/>
    <rect x="326" y="326" width="94" height="94" rx="18"/>
  </g>
  <rect x="209" y="209" width="94" height="94" rx="18" fill="#3FBF7F"/>
</svg>
