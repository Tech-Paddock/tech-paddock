<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Paddock">
  <!-- Lights out. Chosen by Joel on 2026-09-21 from six candidates.
       Colours are the Martini livery's own, copied from lib/theme.css:
       ink #0A1020, pinstripe #C8102E. The unlit row is surface-raised
       darkened, so the gantry reads as a gantry rather than six dots. -->
