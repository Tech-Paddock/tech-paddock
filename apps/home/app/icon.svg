  <rect x="8" y="15" width="48" height="34" rx="8" fill="#16233D"/>
  <circle cx="19" cy="26" r="6" fill="#C8102E"/>
  <circle cx="32" cy="26" r="6" fill="#C8102E"/>
  <circle cx="45" cy="26" r="6" fill="#C8102E"/>
  <circle cx="19" cy="39" r="6" fill="#26364F"/>
  <circle cx="32" cy="39" r="6" fill="#26364F"/>
  <circle cx="45" cy="39" r="6" fill="#26364F"/>
</svg>
