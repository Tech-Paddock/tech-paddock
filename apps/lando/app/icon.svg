<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lando">
  <!-- Lando, a chocolate-dapple miniature dachshund puppy, in a racing helmet
       with the visor down: smoked anthracite, still see-through. Drawn by
       hand as vector shapes; no photo is traced or embedded (RULES.md,
       Never 2). The helmet wears "the blob": a neon lime shell #D7FF1E,
       deeper lime shading #A9CC00, and a few thick black contour loops and
       squiggles #0E0F11 clipped to the shell, with a small smiley. Drawn
       freehand in that spirit, not copied from any real helmet; no sponsor,
       team mark, wordmark or number. The tile and visor are the mcl39
       anthracite #121316 from lib/theme.css. The dog keeps his own colours:
       chocolate, white and tan, a liver nose and amber eyes. favicon.ico,
       apple-touch-icon.png and the manifest PNGs are drawn from this file;
       apple-touch-icon.png is full-bleed (rx 0), since iOS rounds the
       corners itself. The 16px favicon frame is this file with the visor
       tint at 0.22, without the highlight streak and lime reflection, and
       with only the three largest blob shapes at twice the stroke and no
       smiley or cheek lines, so the face and the pattern still read at that
       size. The apps/home/public/lando-icon.svg copy is this file, byte for
       byte. -->
  <defs>
    <clipPath id="face">
      <path d="M256 214 C334 214 366 270 366 330 C366 400 318 446 256 446 C194 446 146 400 146 330 C146 270 178 214 256 214 Z"/>
    </clipPath>
    <clipPath id="shell">
      <path clip-rule="evenodd" d="M256 64 C366 64 438 146 438 262 L438 340 C438 372 414 392 386 392 L362 392 C366 372 368 352 368 330 C368 262 330 222 256 222 C182 222 144 262 144 330 C144 352 146 372 150 392 L126 392 C98 392 74 372 74 340 L74 262 C74 146 146 64 256 64 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#121316"/>

  <!-- long floppy ears, chocolate with two dapple speckles each, hanging out
       under the helmet -->
  <path d="M112 338 C70 368 56 440 70 476 C84 506 140 504 160 472 C174 448 178 400 182 348 Z" fill="#7E5D51"/>
  <path d="M400 338 C442 368 456 440 442 476 C428 506 372 504 352 472 C338 448 334 400 330 348 Z" fill="#7E5D51"/>
  <ellipse cx="98" cy="432" rx="13" ry="10" fill="#C7AEA2"/>
  <ellipse cx="132" cy="474" rx="9" ry="7" fill="#C7AEA2"/>
  <ellipse cx="414" cy="442" rx="12" ry="9" fill="#C7AEA2"/>
  <ellipse cx="380" cy="412" rx="8" ry="6" fill="#C7AEA2"/>

  <!-- face: chocolate over both eyes and the sides of the head, a white blaze
       from the forehead widening down the muzzle -->
  <g clip-path="url(#face)">
    <rect x="140" y="210" width="232" height="240" fill="#7E5D51"/>
    <path d="M240 210 L272 210 C274 262 278 298 290 326 C316 340 340 360 352 392 L360 450 L152 450 L160 392 C172 360 196 340 222 326 C234 298 238 262 240 210 Z" fill="#FAF6F1"/>
    <!-- tan at the cheeks, where the chocolate meets the white -->
    <ellipse cx="180" cy="352" rx="14" ry="8" fill="#D9954F" transform="rotate(-40 180 352)"/>
    <ellipse cx="332" cy="352" rx="14" ry="8" fill="#D9954F" transform="rotate(40 332 352)"/>
    <!-- a dapple speckle on the head -->
    <ellipse cx="174" cy="300" rx="8" ry="6" fill="#C7AEA2"/>
  </g>

  <!-- tan "eyebrow" dots -->
  <ellipse cx="206" cy="282" rx="12" ry="8" fill="#E2A35E"/>
  <ellipse cx="306" cy="282" rx="12" ry="8" fill="#E2A35E"/>
  <!-- amber eyes -->
  <circle cx="208" cy="314" r="19" fill="#2A1A14"/>
  <circle cx="304" cy="314" r="19" fill="#2A1A14"/>
  <circle cx="208" cy="314" r="14" fill="#C98A3A"/>
  <circle cx="304" cy="314" r="14" fill="#C98A3A"/>
  <circle cx="209" cy="316" r="8" fill="#1C110D"/>
  <circle cx="305" cy="316" r="8" fill="#1C110D"/>
  <circle cx="203" cy="308" r="4.5" fill="#FFFFFF"/>
  <circle cx="299" cy="308" r="4.5" fill="#FFFFFF"/>
  <!-- liver nose and mouth -->
  <path d="M226 368 C226 350 286 350 286 368 C286 386 268 398 256 398 C244 398 226 386 226 368 Z" fill="#7A4842"/>
  <ellipse cx="244" cy="362" rx="9" ry="5" fill="#A0706A"/>
  <path d="M256 396 V408 C256 422 236 428 224 416 M256 408 C256 422 276 428 288 416" stroke="#5E3A34" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- helmet shell: crown and cheeks, the face opening cut out -->
  <path fill="#D7FF1E" fill-rule="evenodd" d="M256 64 C366 64 438 146 438 262 L438 340 C438 372 414 392 386 392 L362 392 C366 372 368 352 368 330 C368 262 330 222 256 222 C182 222 144 262 144 330 C144 352 146 372 150 392 L126 392 C98 392 74 372 74 340 L74 262 C74 146 146 64 256 64 Z"/>
  <g clip-path="url(#shell)">
    <!-- deeper lime shading: the shell's lower right and the cheek pads -->
    <path fill="#A9CC00" fill-rule="evenodd" d="M60 50 H452 V400 H60 Z M238 70 C352 70 424 150 424 260 C424 316 404 352 372 376 L370 330 C370 262 330 220 256 220 C182 220 142 262 142 330 L140 376 C104 350 88 316 88 262 C88 150 140 70 238 70 Z"/>
    <!-- the blob: a few thick black contour lines, wavy and looping, running
         off the shell's edge. Few and bold so they still read as a pattern
         at 32px. -->
    <g stroke="#0E0F11" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M120 168 C130 128 168 104 200 116 C228 126 222 160 196 168 C176 174 170 196 146 198 C122 200 114 186 120 168 Z"/>
      <path d="M156 164 C158 150 174 144 184 150 C192 156 184 164 174 166 C166 168 156 174 156 164 Z"/>
      <path d="M220 198 C214 172 236 160 250 172 C262 182 280 176 278 154 C276 130 246 128 242 104 C238 84 262 72 290 78"/>
      <path d="M318 108 C344 92 384 110 386 140 C388 168 358 174 344 162 C330 150 312 164 300 150 C290 138 302 118 318 108 Z"/>
      <path d="M294 200 C302 184 322 188 332 202 C346 220 376 210 386 190 C396 170 420 170 436 186"/>
      <path d="M86 246 C102 270 80 296 96 322 C108 342 90 364 112 392"/>
      <path d="M426 246 C410 270 432 296 416 322 C404 342 422 364 400 392"/>
    </g>
    <!-- a small smiley inside the right-hand loop -->
    <circle cx="344" cy="134" r="12" fill="#0E0F11"/>
    <path d="M338 136 C340 141 348 141 350 136" stroke="#D7FF1E" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <!-- rim round the face opening -->
  <path d="M150 392 C146 372 144 352 144 330 C144 262 182 222 256 222 C330 222 368 262 368 330 C368 352 366 372 362 392" stroke="#0E0F11" stroke-width="8" fill="none"/>
  <!-- visor down over the face: smoked anthracite, still see-through, so
       his eyes, blaze, eyebrow dots and nose read through it -->
  <path d="M112 262 C120 206 178 196 256 196 C334 196 392 206 400 262 L396 334 C390 384 340 410 256 410 C172 410 122 384 116 334 Z" fill="#121316" fill-opacity="0.35"/>
  <path d="M112 262 C120 206 178 196 256 196 C334 196 392 206 400 262 L396 334 C390 384 340 410 256 410 C172 410 122 384 116 334 Z" fill="none" stroke="#121316" stroke-width="8"/>
  <!-- highlight streak across the top of the visor -->
  <path d="M146 236 C178 212 334 212 366 236 C334 224 178 224 146 236 Z" fill="#FFFFFF" fill-opacity="0.55"/>
  <!-- faint lime reflection of the shell at the right edge -->
  <path d="M384 270 C386 306 382 340 368 368" stroke="#D7FF1E" stroke-opacity="0.6" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- visor pivots -->
  <circle cx="104" cy="262" r="16" fill="#121316"/>
  <circle cx="408" cy="262" r="16" fill="#121316"/>
</svg>
